version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: avp_iteam_postgres
    environment:
      POSTGRES_DB: avp_iteam
      POSTGRES_USER: avp_iteam_user
      POSTGRES_PASSWORD: avp_iteam_pass
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - avp_iteam_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avp_iteam_user -d avp_iteam"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: avp_iteam_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - avp_iteam_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: avp_iteam_grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - avp_iteam_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  avp_iteam_data:
  avp_iteam_prometheus_data:
  avp_iteam_grafana_data: