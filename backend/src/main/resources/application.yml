spring:
  application:
    name: avp-iteam

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/avp_iteam}
    username: ${DB_USER:avp_iteam_user}
    password: ${DB_PASSWORD:avp_iteam_pass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

vaadin:
  launch-browser: true

server:
  port: 8080

logging:
  level:
    com.bank.avpiteam: DEBUG
    org.springframework.web: INFO